name: daily-snapshot

# Each group collects on its own hourly cron so the shared Phabricator token's
# rate budget recovers between groups — running all six back-to-back exhausted
# it and 429'd the later ones. One group per run is well under Phab's per-window
# call ceiling. The cron->group mapping below is coupled to src/groups.ts
# (ALL_GROUPS ids); keep them in sync when adding/removing a group.
on:
  schedule:
    - cron: '0 5 * * 1-5' # home-newtab
    - cron: '0 6 * * 1-5' # ip-protection
    - cron: '0 7 * * 1-5' # desktop-theme
    - cron: '0 8 * * 1-5' # sharing
    - cron: '0 9 * * 1-5' # geckoview
    - cron: '0 10 * * 1-5' # credential-management
  workflow_dispatch:
    inputs:
      group:
        description: 'Group id to collect (blank = all groups, sequential — may 429 on later groups)'
        required: false
        default: ''

permissions:
  contents: write

# One snapshot run at a time. The shared Phabricator token must never be hit
# concurrently, so a cron-delayed run queues behind any in-flight run rather
# than racing it (and racing the push).
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # caps the runaway-backfill problem (a single run once hit 2.5h)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Map the cron that triggered this run to its group. On workflow_dispatch
      # there is no github.event.schedule, so fall back to the input (blank =
      # every group). cache_key scopes the actions/cache entry below.
      - name: Resolve group(s) for this trigger
        id: resolve
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_GROUP: ${{ github.event.inputs.group }}
        run: |
          all="home-newtab ip-protection desktop-theme sharing geckoview credential-management"
          case "$SCHEDULE" in
            '0 5 * * 1-5')  groups="home-newtab" ;;
            '0 6 * * 1-5')  groups="ip-protection" ;;
            '0 7 * * 1-5')  groups="desktop-theme" ;;
            '0 8 * * 1-5')  groups="sharing" ;;
            '0 9 * * 1-5')  groups="geckoview" ;;
            '0 10 * * 1-5') groups="credential-management" ;;
            *)              groups="${INPUT_GROUP:-$all}" ;;
          esac
          # cache_key is the single group id, or "all" when collecting every group.
          case "$groups" in
            *' '*) cache_key="all" ;;
            *)     cache_key="$groups" ;;
          esac
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >> "$GITHUB_OUTPUT"
          echo "Collecting: $groups (cache_key=$cache_key)"
      # Persist the per-group Phabricator transaction cache across runs. It's
      # gitignored (data/*/.phab-progress.json) so the commit step never lands
      # it; restoring it lets each run skip transaction.search for revisions
      # unchanged since last run. The run_id in the key forces a fresh save each
      # run; restore-keys prefix-match picks up the most recent prior cache.
      - name: Restore Phabricator progress cache
        uses: actions/cache@v4
        with:
          path: data/*/.phab-progress.json
          key: phab-progress-${{ steps.resolve.outputs.cache_key }}-${{ github.run_id }}
          restore-keys: |
            phab-progress-${{ steps.resolve.outputs.cache_key }}-
      - run: bun run collect ${{ steps.resolve.outputs.groups }}
        env:
          PHABRICATOR_TOKEN: ${{ secrets.PHABRICATOR_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: Commit snapshot
        run: |
          git config user.name  "hnt-tat-bot"
          git config user.email "hnt-tat-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(data): snapshot ${{ steps.resolve.outputs.groups }} $(date -u +%F)"
            # Rebase onto any commit that landed since checkout before pushing.
            # Data files are group-scoped, so this fast-forwards cleanly.
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi

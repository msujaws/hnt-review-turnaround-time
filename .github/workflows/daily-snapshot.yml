name: daily-snapshot

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

# One snapshot run at a time. A queued cron/dispatch run waits rather than
# racing the commit job's push, so that push is always a fast-forward.
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # caps the runaway-backfill problem (a single run once hit 2.5h)
    strategy:
      max-parallel: 1 # shared Phabricator token -> never run Phab calls concurrently
      fail-fast: false # one group's 429 must not cancel the others
      matrix:
        group:
          - home-newtab
          - ip-protection
          - desktop-theme
          - sharing
          - geckoview
          - credential-management
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run collect ${{ matrix.group }}
        env:
          PHABRICATOR_TOKEN: ${{ secrets.PHABRICATOR_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
      # Hand the group's data to the commit job instead of pushing here, so a
      # single writer lands one commit (one Vercel deploy) with no push races.
      - name: Upload group data
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.group }}
          path: data/${{ matrix.group }}/

  commit:
    needs: collect
    if: ${{ always() }} # publish whatever groups succeeded, even if some failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Each artifact's files sit at its root (upload strips the data/<group>/
      # prefix), so download into per-artifact dirs and rebuild data/<group>/
      # from the artifact name. merge-multiple would collapse every group's
      # samples.json onto each other instead.
      - name: Download group data
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: data-*
      - name: Reconstruct data directories
        run: |
          shopt -s nullglob
          for dir in incoming/data-*/; do
            group="$(basename "$dir")"
            group="${group#data-}"
            mkdir -p "data/$group"
            cp -R "$dir". "data/$group/"
          done
      - name: Commit snapshot
        run: |
          git config user.name  "hnt-tat-bot"
          git config user.email "hnt-tat-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(data): daily snapshot $(date -u +%F)"
            git push
          fi
